services:
  # Sentiment Aura Backend
  - type: web
    name: sentiment-aura
    env: python
    repo: https://github.com/yourusername/sentiment-aura.git
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://sentiment-aura.netlify.app
        sync: false